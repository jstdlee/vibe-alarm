# XcodeGen specification for VibeAlarm
# Generate locally on macOS: brew install xcodegen && xcodegen generate && open VibeAlarm.xcodeproj
# CI (.github/workflows/ci.yml) generates and builds it automatically.
name: VibeAlarm
options:
  bundleIdPrefix: com.jstdlee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    VIBEALARM_BUNDLE_ID: com.jstdlee.vibealarm
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  VibeAlarmCore:
    path: VibeAlarmCore

targets:
  VibeAlarm:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Shared
    dependencies:
      - package: VibeAlarmCore
      - target: VibeAlarmWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEALARM_BUNDLE_ID)
        INFOPLIST_KEY_CFBundleDisplayName: VibeAlarm
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: VibeAlarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsFullAccessUsageDescription: VibeAlarm reads your local calendars on-device to automatically skip wake-up alarms on PTO and vacation days. Calendar data never leaves your iPhone.
        NSCalendarsUsageDescription: VibeAlarm reads your local calendars on-device to automatically skip wake-up alarms on PTO and vacation days. Calendar data never leaves your iPhone.
        VibeAlarmAppGroup: group.$(VIBEALARM_BUNDLE_ID)
        VibeAlarmKeychainGroup: $(VIBEALARM_BUNDLE_ID).byok
    entitlements:
      path: iOS/App/VibeAlarm.entitlements
      properties:
        com.apple.security.application-groups: [group.$(VIBEALARM_BUNDLE_ID)]

  VibeAlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widget
      - iOS/Shared
    dependencies:
      - package: VibeAlarmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIBEALARM_BUNDLE_ID).widget
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: VibeAlarm Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        VibeAlarmAppGroup: group.$(VIBEALARM_BUNDLE_ID)
        VibeAlarmKeychainGroup: $(VIBEALARM_BUNDLE_ID).byok
    entitlements:
      path: iOS/Widget/VibeAlarmWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(VIBEALARM_BUNDLE_ID)]

schemes:
  VibeAlarm:
    build:
      targets:
        VibeAlarm: all
        VibeAlarmWidget: all
