name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Pick simulator
        run: echo "SIM_UDID=$(scripts/pick-simulator.sh)" >> "$GITHUB_ENV"

      - name: Unit tests (VibeAlarmCore on iOS Simulator)
        working-directory: VibeAlarmCore
        run: |
          set -o pipefail
          xcodebuild test -scheme VibeAlarmCore -destination "id=$SIM_UDID" \
            -resultBundlePath ../build/CoreTests.xcresult | xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app + widget extension (Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project VibeAlarm.xcodeproj -scheme VibeAlarm -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Capture real iOS Simulator screenshots (Light Theme)
        id: screenshots
        run: |
          set -euo pipefail
          mkdir -p dist/screenshots
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true
          xcrun simctl status_bar "$SIM_UDID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100 || true

          APP_PATH=$(find build/sim/Build/Products -name "VibeAlarm.app" | head -1)
          echo "Installing $APP_PATH on simulator $SIM_UDID"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          app_running() {
            local services
            services="$(xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null || true)"
            case "$services" in
              *"UIKitApplication:com.jstdlee.vibealarm"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          capture_screen() {
            local mode="$1"
            local out="$2"
            for attempt in 1 2 3 4; do
              xcrun simctl terminate "$SIM_UDID" com.jstdlee.vibealarm || true
              sleep 2
              xcrun simctl launch "$SIM_UDID" com.jstdlee.vibealarm -ui-preview-screen "$mode" || true
              sleep 8
              if app_running; then
                # Let the first frame render; the Intel simulator can show the blank launch screen for several seconds.
                sleep 10
                xcrun simctl io "$SIM_UDID" screenshot "dist/screenshots/$out"
                local size
                size=$(stat -f%z "dist/screenshots/$out")
                if [ "$size" -gt 100000 ]; then
                  echo "Captured $out (attempt $attempt, $size bytes)"
                  return 0
                fi
                echo "::warning::Screenshot for $mode looks blank ($size bytes), retrying (attempt $attempt)"
                continue
              fi
              echo "::warning::VibeAlarm not running for mode $mode (attempt $attempt)"
            done
            echo "::error::Could not capture $mode: app is not running (crash?)"
            CAPTURE_FAILED=1
          }

          CAPTURE_FAILED=0
          capture_screen "dashboard" "01-two-day-dashboard.png"
          capture_screen "dial" "02-dual-thumb-dial.png"
          capture_screen "calendar" "03-builtin-calendar-events.png"
          capture_screen "settings" "04-external-and-ios-calendar-settings.png"
          capture_screen "widget" "05-widgets-and-byok.png"
          ls -lh dist/screenshots/
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*VibeAlarm* dist/crashes/ 2>/dev/null || true
          ls -l dist/crashes/
          if [ "$CAPTURE_FAILED" != "0" ]; then
            for f in dist/crashes/*; do [ -f "$f" ] && head -c 6000 "$f"; done
            exit 1
          fi

      - name: Build for device & package unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build -project VibeAlarm.xcodeproj -scheme VibeAlarm -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
          mkdir -p dist/Payload
          cp -R build/device/Build/Products/Release-iphoneos/VibeAlarm.app dist/Payload/
          (cd dist && zip -qry "VibeAlarm.ipa" Payload && rm -rf Payload)
          (cd dist && shasum -a 256 "VibeAlarm.ipa" > "VibeAlarm.ipa.sha256")
          ls -lh dist/

      - name: Upload unsigned IPA, screenshots & test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VibeAlarm-unsigned-ipa
          path: |
            dist/VibeAlarm.ipa
            dist/VibeAlarm.ipa.sha256
            dist/screenshots/*.png
            dist/crashes/*
            build/*.xcresult
          if-no-files-found: error
