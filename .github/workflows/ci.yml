name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Pick simulators
        run: |
          echo "SIM_UDID=$(scripts/pick-simulator.sh)" >> "$GITHUB_ENV"
          echo "SIM_SMALL=$(scripts/pick-small-simulator.sh)" >> "$GITHUB_ENV"

      - name: Unit tests (VibeAlarmCore on iOS Simulator)
        working-directory: VibeAlarmCore
        run: |
          set -o pipefail
          xcodebuild test -scheme VibeAlarmCore -destination "id=$SIM_UDID" \
            -resultBundlePath ../build/CoreTests.xcresult | xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app + widget extension (Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project VibeAlarm.xcodeproj -scheme VibeAlarm -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Capture iOS Simulator screenshots (light theme)
        timeout-minutes: 45
        run: |
          set -euo pipefail
          APP_PATH=$(find build/sim/Build/Products -name "VibeAlarm.app" | head -1)
          echo "Installing $APP_PATH"
          scripts/capture-screenshots.sh "$SIM_UDID" "$APP_PATH" "dist/screenshots"

      - name: Capture small phone screenshots (375 x 667)
        # A layout check, not a release gate: it must never stall the run.
        continue-on-error: true
        timeout-minutes: 28
        run: |
          set -euo pipefail
          APP_PATH=$(find build/sim/Build/Products -name "VibeAlarm.app" | head -1)
          echo "Installing $APP_PATH on $SIM_SMALL"
          CAPTURE_DARK=0 scripts/capture-screenshots.sh "$SIM_SMALL" "$APP_PATH" "dist/screenshots-small"

      - name: Collect crash reports
        if: always()
        timeout-minutes: 4
        run: |
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*VibeAlarm* ~/Library/Logs/DiagnosticReports/JetsamEvent* dist/crashes/ 2>/dev/null || true
          ls -l dist/crashes/ || true

      - name: Build for device & package unsigned IPA
        timeout-minutes: 30
        run: |
          set -o pipefail
          # The screenshot simulators are finished. Shut them down so the device
          # build is not competing with a stuck simulator for the rest of the job.
          xcrun simctl shutdown all || true
          xcodebuild build -project VibeAlarm.xcodeproj -scheme VibeAlarm -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
          mkdir -p dist/Payload
          cp -R build/device/Build/Products/Release-iphoneos/VibeAlarm.app dist/Payload/
          (cd dist && zip -qry "VibeAlarm.ipa" Payload && rm -rf Payload)
          (cd dist && shasum -a 256 "VibeAlarm.ipa" > "VibeAlarm.ipa.sha256")
          ls -lh dist/

      - name: Upload unsigned IPA, screenshots & test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VibeAlarm-unsigned-ipa
          path: |
            dist/VibeAlarm.ipa
            dist/VibeAlarm.ipa.sha256
            dist/screenshots/**/*.png
            dist/screenshots-small/**/*.png
            dist/screenshots/crashes/*
            dist/screenshots-small/crashes/*
            dist/crashes/*
            build/*.xcresult
          if-no-files-found: error
